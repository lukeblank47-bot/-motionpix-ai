<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MotionPix AI Generator</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;

      color: white;

      background:

        radial-gradient(circle at top, #28104a 0%, #100719 45%, #050507 100%);

    }

    .container {

      width: 90%;

      max-width: 700px;

      margin: 0 auto;

      padding: 60px 0;

    }

    h1 {

      text-align: center;

      font-size: 46px;

      margin-bottom: 10px;

    }

    h1 span {

      color: #a855f7;

    }

    .subtitle {

      text-align: center;

      color: #bcb4c7;

      font-size: 17px;

      margin-bottom: 35px;

    }

    .generator-box {

      background: rgba(17, 12, 24, 0.95);

      border: 1px solid #392b48;

      border-radius: 22px;

      padding: 25px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);

    }

    label {

      display: block;

      font-size: 16px;

      font-weight: bold;

      margin-bottom: 10px;

    }

    textarea {

      width: 100%;

      height: 150px;

      padding: 16px;

      background: #09070d;

      color: white;

      border: 1px solid #453653;

      border-radius: 14px;

      font-size: 16px;

      resize: vertical;

      outline: none;

      margin-bottom: 18px;

    }

    textarea:focus {

      border-color: #a855f7;

    }

    select {

      width: 100%;

      padding: 15px;

      background: #09070d;

      color: white;

      border: 1px solid #453653;

      border-radius: 14px;

      font-size: 16px;

      margin-bottom: 18px;

      outline: none;

    }

    button {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 14px;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      background: linear-gradient(90deg, #7c3aed, #c026d3);

    }

    button:disabled {

      opacity: 0.6;

    }

    #result {

      display: none;

      margin-top: 22px;

      padding: 18px;

      background: #09070d;

      border: 1px solid #392b48;

      border-radius: 14px;

      text-align: center;

      overflow: hidden;

    }

    #result img,

    #result video {

      display: block;

      width: 100%;

      border-radius: 12px;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>MotionPix <span>AI</span></h1>

    <p class="subtitle">

      Turn your imagination into AI images and videos.

    </p>

    <div class="generator-box">

      <label for="prompt">

        What do you want to create?

      </label>

      <textarea

        id="prompt"

        placeholder="Example: Create a cinematic video of a futuristic city at night"

      ></textarea>

      <select id="type">

        <option value="image">

          Generate AI Image

        </option>

        <option value="video">

          Generate AI Video

        </option>

      </select>

      <button id="generateButton" onclick="generate()">

        ✨ Generate

      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>

    async function generate() {

      const prompt =

        document.getElementById("prompt").value;

      const type =

        document.getElementById("type").value;

      const result =

        document.getElementById("result");

      const button =

        document.getElementById("generateButton");

      if (!prompt.trim()) {

        alert("Tell MotionPix AI what you want to create.");

        return;

      }

      result.style.display = "block";

      result.innerHTML =

        "✨ MotionPix AI is creating your " +

        type +

        "...<br><br>Please wait.";

      button.disabled = true;

      button.textContent = "✨ Creating...";

      try {

        const endpoint =

          type === "video"

            ? "/api/generate-video"

            : "/api/generate-image";

        const response = await fetch(endpoint, {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify({

            prompt: prompt

          })

        });

        const data = await response.json();

        if (!response.ok) {

          throw new Error(

            data.error || "Generation failed"

          );

        }

        if (!data.url) {

          throw new Error(

            "No generated file was returned."

          );

        }

        result.innerHTML = "";

        if (type === "video") {

          const video =

            document.createElement("video");

          video.src = data.url;

          video.controls = true;

          video.autoplay = true;

          video.playsInline = true;

          result.appendChild(video);

        } else {

          const image =

            document.createElement("img");

          image.src = data.url;

          image.alt =

            "MotionPix AI generated image";

          result.appendChild(image);

        }

      } catch (error) {

        result.innerHTML =

          "❌ Something went wrong: " +

          error.message;

      } finally {

        button.disabled = false;

        button.textContent = "✨ Generate";

      }

    }

  </script>

</body>

</html>
