<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotionPix AI Generator</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background:

    radial-gradient(circle at top, #32105c 0%, #12051f 35%, #07030c 75%);

  color: white;

}

.page {

  width: min(92%, 760px);

  margin: auto;

  padding: 45px 0 80px;

}

.logo {

  text-align: center;

  font-size: 42px;

  font-weight: 900;

  margin-bottom: 8px;

}

.logo span {

  color: #c33cff;

}

.subtitle {

  text-align: center;

  color: #c8bfd2;

  font-size: 17px;

  margin-bottom: 35px;

}

.card {

  background: rgba(17, 8, 28, .92);

  border: 1px solid #56306f;

  border-radius: 24px;

  padding: 22px;

  box-shadow: 0 20px 60px rgba(0,0,0,.35);

}

label {

  display: block;

  font-weight: 700;

  margin-bottom: 10px;

}

textarea {

  width: 100%;

  min-height: 145px;

  resize: vertical;

  padding: 16px;

  border-radius: 15px;

  border: 1px solid #65427d;

  background: #0d0714;

  color: white;

  font-size: 16px;

  outline: none;

}

select {

  width: 100%;

  margin-top: 15px;

  padding: 15px;

  border-radius: 14px;

  border: 1px solid #65427d;

  background: #0d0714;

  color: white;

  font-size: 16px;

}

button {

  width: 100%;

  margin-top: 16px;

  padding: 17px;

  border: 0;

  border-radius: 15px;

  color: white;

  font-size: 19px;

  font-weight: 800;

  cursor: pointer;

  background: linear-gradient(90deg, #7c32ff, #d421d9);

}

button:disabled {

  opacity: .55;

}

.secondary {

  background: linear-gradient(90deg, #5a20c8, #8c28ff);

}

#result {

  display: none;

  margin-top: 22px;

  padding: 14px;

  border: 1px solid #4c315d;

  border-radius: 18px;

  background: #09040e;

  text-align: center;

}

#result img,

#result video {

  display: block;

  width: 100%;

  border-radius: 15px;

}

#videoButton {

  display: none;

}

.status {

  padding: 22px 10px;

  color: #d9cce2;

  line-height: 1.5;

}

</style>

</head>

<body>

<div class="page">

  <div class="logo">MotionPix <span>AI</span></div>

  <div class="subtitle">

    Create realistic AI images and turn your best image into video.

  </div>

  <div class="card">

    <label for="prompt">What do you want to create?</label>

    <textarea

      id="prompt"

      placeholder="Example: A photorealistic purple supercar on a real city street at night"

    ></textarea>

    <select id="type">

      <option value="image">Generate AI Image</option>

      <option value="video">Generate AI Video</option>

    </select>

    <button id="generateButton" onclick="generate()">

      ✨ Generate

    </button>

    <div id="result"></div>

    <button

      id="videoButton"

      class="secondary"

      onclick="turnImageIntoVideo()"

    >

      🎬 Turn This Image Into Video

    </button>

  </div>

</div>

<script>

let lastImageUrl = "";

async function requestGeneration(endpoint, body) {

  const response = await fetch(endpoint, {

    method: "POST",

    headers: {

      "Content-Type": "application/json"

    },

    body: JSON.stringify(body)

  });

  const data = await response.json();

  if (!response.ok) {

    throw new Error(data.error || "Generation failed");

  }

  if (!data.url) {

    throw new Error("No generated file was returned.");

  }

  return data.url;

}

function showStatus(message) {

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =

    '<div class="status">' + message + "</div>";

}

async function generate() {

  const prompt = document.getElementById("prompt").value.trim();

  const type = document.getElementById("type").value;

  const button = document.getElementById("generateButton");

  const videoButton = document.getElementById("videoButton");

  if (!prompt) {

    alert("Tell MotionPix AI what you want to create.");

    return;

  }

  button.disabled = true;

  videoButton.style.display = "none";

  try {

    if (type === "image") {

      button.textContent = "✨ Creating image...";

      showStatus("✨ Creating your realistic AI image...");

      const url = await requestGeneration(

        "/api/generate-image",

        { prompt }

      );

      lastImageUrl = url;

      const result = document.getElementById("result");

      result.innerHTML = "";

      const image = document.createElement("img");

      image.src = url;

      image.alt = "MotionPix AI generated image";

      result.appendChild(image);

      videoButton.style.display = "block";

    } else {

      button.textContent = "🎬 Creating video...";

      showStatus("🎬 Creating your AI video... This may take a little while.");

      const url = await requestGeneration(

        "/api/generate-video",

        { prompt }

      );

      showVideo(url);

    }

  } catch (error) {

    showStatus("❌ " + error.message);

  } finally {

    button.disabled = false;

    button.textContent = "✨ Generate";

  }

}

async function turnImageIntoVideo() {

  const prompt = document.getElementById("prompt").value.trim();

  const button = document.getElementById("videoButton");

  if (!lastImageUrl) {

    alert("Generate an image first.");

    return;

  }

  button.disabled = true;

  button.textContent = "🎬 Creating video...";

  showStatus(

    "🎬 Turning your image into a 5-second video..."

  );

  try {

    const url = await requestGeneration(

      "/api/image-to-video",

      {

        prompt:

          prompt,

        imageUrl: lastImageUrl

      }

    );

    showVideo(url);

    button.style.display = "none";

  } catch (error) {

    showStatus("❌ " + error.message);

    button.style.display = "block";

  } finally {

    button.disabled = false;

    button.textContent = "🎬 Turn This Image Into Video";

  }

}

function showVideo(url) {

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = "";

  const video = document.createElement("video");

  video.src = url;

  video.controls = true;

  video.autoplay = true;

  video.playsInline = true;

  result.appendChild(video);

}

</script>

</body>

</html>
