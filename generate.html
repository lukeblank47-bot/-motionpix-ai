<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MotionPix AI Generator</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #0f172a;

      color: white;

      text-align: center;

    }

    .container {

      max-width: 700px;

      margin: auto;

      padding: 50px 20px;

    }

    h1 {

      font-size: 42px;

      margin-bottom: 10px;

    }

    .blue {

      color: #38bdf8;

    }

    p {

      color: #cbd5e1;

      font-size: 18px;

    }

    textarea {

      width: 90%;

      height: 140px;

      margin-top: 30px;

      padding: 15px;

      border-radius: 12px;

      font-size: 17px;

    }

    select {

      width: 95%;

      padding: 15px;

      margin-top: 15px;

      border-radius: 12px;

      font-size: 17px;

    }

    button {

      width: 95%;

      padding: 18px;

      margin-top: 20px;

      border: none;

      border-radius: 12px;

      background: #38bdf8;

      font-size: 20px;

      font-weight: bold;

      cursor: pointer;

    }

    #result {

      margin-top: 25px;

      padding: 20px;

      background: #1e293b;

      border-radius: 12px;

      display: none;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>MotionPix <span class="blue">AI</span></h1>

    <h2>Create with AI</h2>

    <p>Describe what you want MotionPix AI to create.</p>

    <textarea

      id="prompt"

      placeholder="Example: Create a cinematic video of a futuristic city at night..."

    ></textarea>

    <select id="type">

      <option value="image">Generate AI Image</option>

      <option value="video">Generate AI Video</option>

    </select>

    <button onclick="generate()">✨ Generate</button>

    <div id="result"></div>

  </div>

  <script>

 async   function generate() {

      const prompt = document.getElementById("prompt").value;

      const type = document.getElementById("type").value;

      const result = document.getElementById("result");

      if (!prompt.trim()) {

        alert("Tell MotionPix AI what you want to create.");

        return;

      }

      result.style.display = "block";

      result.innerHTML =

        "✨ MotionPix AI is ready to generate your " +

        type +

        ".<br><br><strong>Your prompt:</strong><br>" +

        prompt;

    }

  </script>

</body>

</html>
